<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | Monsta Live</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="container navbar">

        <a href="index.html" class="logo">

            Monsta <span>Live</span>

        </a>

        <nav>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>

                <li><a href="stream.html">Streams</a></li>

                <li><a href="login.html">Logout</a></li>

            </ul>

        </nav>

    </div>

</header>

<section class="profile-header">

    <img
        src="https://picsum.photos/200"
        alt="Profile Picture"
        class="profile-avatar">

    <h2>

        Monsta User

    </h2>

    <p>

        Content Creator • Gamer • Live Every Day

    </p>

</section>

<section class="profile-stats">

    <div class="stat-box">

        <h3>120</h3>

        <span>Followers</span>

    </div>

    <div class="stat-box">

        <h3>35</h3>

        <span>Following</span>

    </div>

    <div class="stat-box">

        <h3>18</h3>

        <span>Streams</span>

    </div>

</section>

<section class="container">

    <h2 class="section-title">

        My Streams

    </h2>

    <div class="stream-grid">

        <div class="stream-card">

            <div class="stream-thumbnail">

                <img
                    src="https://picsum.photos/500/300?61"
                    alt="Stream">

                <span class="live-tag">

                    LIVE

                </span>

            </div>

            <div class="stream-info">

                <h3>

                    Battle Arena

                </h3>

                <p>

                    👀 1.2K Watching

                </p>

                <button class="watch-btn">

                    Watch Stream

                </button>

            </div>

        </div>

        <div class="stream-card">

            <div class="stream-thumbnail">

                <img
                    src="https://picsum.photos/500/300?62"
                    alt="Stream">

            </div>

            <div class="stream-info">

                <h3>

                    Music Live

                </h3>

                <p>

                    Uploaded Yesterday

                </p>

                <button class="watch-btn">

                    Watch Replay

                </button>

            </div>

        </div>

    </div>

</section>

<footer>

    <div class="footer-bottom">

        © 2026 Monsta Live. All Rights Reserved.

    </div>

</footer>

<script src="script.js"></script>

</body>

</html>
