<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Monsta Live</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <div class="container navbar">

        <a href="index.html" class="logo">

            Monsta <span>Live</span>

        </a>

        <nav>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

            </ul>

        </nav>

    </div>

</header>

<section class="auth-page">

    <div class="auth-card">

        <h1>

            Create Account

        </h1>

        <form id="signupForm">

            <input
                type="text"
                id="fullname"
                placeholder="Full Name"
                required>

            <input
                type="email"
                id="signupEmail"
                placeholder="Email Address"
                required>

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                required>

            <button type="submit">

                Create Account

            </button>

        </form>

        <p>

            Already have an account?

            <a href="login.html">

                Login

            </a>

        </p>

    </div>

</section>

<script src="script.js"></script>

</body>

</html>
