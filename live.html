<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Now</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="stream-header">
<h1>🔴 LIVE NOW</h1>
</header>

<div class="go-live-container">
<h2>Your stream is live!</h2>

<div style="background:#000;border-radius:12px;overflow:hidden;">

    <video
        width="100%"
        height="260"
        controls
        autoplay
        muted
        playsinline
        poster="https://via.placeholder.com/900x500/000000/FFFFFF?text=MONSTA+LIVE">
        <source src="sample.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div style="padding:15px;color:#fff;">
        <h3>🔴 LIVE</h3>
        <p>👤 Creator: Monsta</p>
        <p>👥 Viewers: 0</p>
    </div>
</div>

</body>
</html>
